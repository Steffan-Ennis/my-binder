<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>my-binder icon</title>

  <!-- Binder body -->
  <g id="binder">
    <rect x="130" y="110" width="100" height="130" rx="6" ry="6" fill="#3d5a80" stroke="#1f3a5f" stroke-width="2"/>
    <!-- Spine -->
    <rect x="130" y="110" width="14" height="130" fill="#2c3e50"/>
    <!-- Rings -->
    <circle cx="137" cy="142" r="2.5" fill="#ecf0f1"/>
    <circle cx="137" cy="175" r="2.5" fill="#ecf0f1"/>
    <circle cx="137" cy="208" r="2.5" fill="#ecf0f1"/>
    <!-- Label -->
    <rect x="160" y="198" width="58" height="30" rx="2" fill="#ecf0f1" stroke="#95a5a6" stroke-width="0.8"/>
  </g>

  <!-- Cards fanning out of binder's top-left corner (130, 110) -->
  <!-- Drawn back-to-front: 65° (back), 50° (middle), 35° (front) -->

  <!-- Card 3: 65° tilt — green border -->
  <g transform="rotate(-65, 130, 110)">
    <rect x="130" y="40" width="50" height="70" rx="3.5" ry="3.5" fill="#1e8449" stroke="#0e5631" stroke-width="1.5"/>
    <rect x="133.5" y="43.5" width="43" height="63" rx="2" ry="2" fill="#fdfdfd"/>
  </g>

  <!-- Card 2: 50° tilt — red border -->
  <g transform="rotate(-50, 130, 110)">
    <rect x="130" y="40" width="50" height="70" rx="3.5" ry="3.5" fill="#c0392b" stroke="#7b241c" stroke-width="1.5"/>
    <rect x="133.5" y="43.5" width="43" height="63" rx="2" ry="2" fill="#fdfdfd"/>
  </g>

  <!-- Card 1: 35° tilt — blue border -->
  <g transform="rotate(-35, 130, 110)">
    <rect x="130" y="40" width="50" height="70" rx="3.5" ry="3.5" fill="#2471a3" stroke="#1a5276" stroke-width="1.5"/>
    <rect x="133.5" y="43.5" width="43" height="63" rx="2" ry="2" fill="#fdfdfd"/>
  </g>
</svg>
