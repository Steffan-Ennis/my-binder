<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgD" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#1c1a20"/>
      <stop offset="70%" stop-color="#12101a"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </radialGradient>
    <radialGradient id="hlD" cx="45%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4238"/>
      <stop offset="50%" stop-color="#2e2820"/>
      <stop offset="100%" stop-color="#4a4238"/>
    </linearGradient>
  </defs>

  <!-- Medallion -->
  <circle cx="200" cy="200" r="196" fill="#08060a"/>
  <circle cx="200" cy="200" r="193" fill="url(#bgD)" stroke="url(#rimD)" stroke-width="3"/>
  <circle cx="200" cy="200" r="193" fill="url(#hlD)"/>
  <circle cx="200" cy="200" r="183" fill="none" stroke="#2a2530" stroke-width="1" opacity="0.4"/>

  <!-- Central card — embossed rectangle -->
  <g transform="translate(200,208)">
    <!-- Card shadow -->
    <rect x="-40" y="-58" width="80" height="116" rx="4" fill="#0a0810"/>
    <!-- Card face -->
    <rect x="-37" y="-55" width="74" height="110" rx="3"
      fill="#1e1a22" stroke="#2a2530" stroke-width="1.2"/>
    <!-- Art box -->
    <rect x="-30" y="-48" width="60" height="40" rx="2"
      fill="#16141c" stroke="#222030" stroke-width="0.5" opacity="0.6"/>
    <!-- Title bar -->
    <rect x="-30" y="-48" width="60" height="10" rx="2"
      fill="#1e1a24" stroke="#2a2530" stroke-width="0.3" opacity="0.5"/>
    <!-- Text lines -->
    <line x1="-24" y1="4" x2="24" y2="4" stroke="#1e1a24" stroke-width="1.5" opacity="0.4"/>
    <line x1="-24" y1="12" x2="16" y2="12" stroke="#1e1a24" stroke-width="1.5" opacity="0.35"/>
    <line x1="-24" y1="20" x2="20" y2="20" stroke="#1e1a24" stroke-width="1.5" opacity="0.3"/>
    <line x1="-24" y1="28" x2="8" y2="28" stroke="#1e1a24" stroke-width="1.5" opacity="0.25"/>
    <line x1="-24" y1="36" x2="14" y2="36" stroke="#1e1a24" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- Dragon coiling around card — filled silhouette approach -->

  <!-- Tail section: sweeping up from bottom-left -->
  <!-- Shadow -->
  <path d="
    M75,350 C55,325 48,285 62,252 C76,220 105,200 135,195
    C145,193 152,195 156,200
  " fill="#1a1020" opacity="0.4" stroke="none"/>
  <!-- Body -->
  <path d="
    M80,345 C62,322 55,286 68,255 C82,224 108,205 136,200
    C145,198 152,200 155,205
  " fill="#2e1e28" stroke="none"/>
  <!-- Inner edge cutout to taper the body -->
  <path d="
    M92,335 C78,316 72,288 82,262 C92,236 112,218 134,212
    C142,210 148,212 150,216
  " fill="#12101a" stroke="none"/>

  <!-- Tail tip -->
  <path d="M80,345 C72,356 68,365 74,370 C80,374 86,366 82,356"
    fill="#2e1e28"/>

  <!-- Body behind card (left side, going up) — partially hidden -->
  <path d="
    M155,205 C158,195 158,180 156,165 C154,148 152,135 154,122
  " fill="none" stroke="#2e1e28" stroke-width="22" stroke-linecap="round" opacity="0.4"/>

  <!-- Body over the top -->
  <!-- Shadow -->
  <path d="
    M148,125 C150,102 165,85 200,75 C235,65 258,78 268,100
  " fill="none" stroke="#1a1020" stroke-width="30" stroke-linecap="round" opacity="0.3"/>
  <!-- Main body silhouette over top -->
  <path d="
    M150,122
    C148,108 152,92 166,80
    C180,68 196,64 212,66
    C228,68 244,78 254,92
    C262,104 266,116 268,128
  " fill="#2e1e28" stroke="none"/>
  <!-- Inner cutout -->
  <path d="
    M158,120
    C156,110 160,98 170,90
    C182,80 198,76 212,78
    C226,80 238,88 246,100
    C252,110 254,118 256,126
  " fill="#12101a" stroke="none"/>

  <!-- Body down the right side -->
  <path d="
    M260,105
    C272,118 274,140 272,162
    C270,184 266,206 264,228
    C262,248 264,265 270,280
  " fill="#2e1e28" stroke="none"/>
  <!-- Inner cutout -->
  <path d="
    M256,115
    C264,126 266,144 264,164
    C262,184 258,204 256,226
    C254,244 256,258 260,270
  " fill="#12101a" stroke="none"/>

  <!-- Body under card (right to centre) — partially hidden -->
  <path d="
    M270,280 C278,300 274,318 258,328 C242,336 222,330 210,316
  " fill="none" stroke="#2e1e28" stroke-width="22" stroke-linecap="round" opacity="0.4"/>

  <!-- Spine ridges -->
  <g fill="#3a2838" opacity="0.55">
    <!-- Tail section -->
    <path d="M68,330 L58,336 L72,332"/>
    <path d="M60,308 L48,312 L64,310"/>
    <path d="M56,284 L44,284 L60,286"/>
    <path d="M60,260 L48,256 L64,262"/>
    <path d="M70,240 L60,234 L74,242"/>
    <path d="M86,224 L78,216 L90,226"/>
    <path d="M106,212 L100,204 L110,214"/>
    <!-- Top section -->
    <path d="M160,100 L154,86 L164,98"/>
    <path d="M178,82 L176,68 L182,80"/>
    <path d="M198,72 L200,58 L204,70"/>
    <path d="M220,72 L224,58 L226,70"/>
    <path d="M240,80 L248,68 L246,80"/>
    <path d="M256,96 L266,86 L262,98"/>
    <!-- Right section -->
    <path d="M272,120 L282,112 L276,122"/>
    <path d="M276,145 L286,140 L280,148"/>
    <path d="M274,170 L284,168 L278,174"/>
    <path d="M272,195 L282,196 L276,200"/>
    <path d="M270,222 L280,226 L274,228"/>
    <path d="M268,248 L278,254 L272,254"/>
    <path d="M272,272 L282,280 L276,278"/>
  </g>

  <!-- Belly ridges -->
  <path d="M92,335 C78,316 72,288 82,262 C92,236 112,218 134,212"
    fill="none" stroke="#36283e" stroke-width="1.5" opacity="0.35"/>

  <!-- Claws gripping card edges -->
  <g stroke="#3a2838" stroke-width="1.2" stroke-linecap="round" opacity="0.55" fill="none">
    <!-- Left claw on card edge -->
    <path d="M155,200 L142,194 M155,200 L140,200 M155,200 L142,208"/>
    <!-- Right claw -->
    <path d="M245,200 L258,194 M245,200 L260,200 M245,200 L258,208"/>
    <!-- Top claw -->
    <path d="M200,145 L192,132 M200,145 L200,130 M200,145 L208,132"/>
  </g>

  <!-- Head at top -->
  <g transform="translate(200,72)">
    <!-- Skull -->
    <path d="M-20,6 C-24,-10 -16,-28 0,-32 C16,-28 24,-10 20,6 C16,14 -16,14 -20,6Z"
      fill="#302440"/>
    <!-- Snout -->
    <path d="M-12,2 C-14,-8 -7,-18 0,-22 C7,-18 14,-8 12,2"
      fill="#28203a"/>
    <!-- Nostrils -->
    <ellipse cx="-4" cy="-15" rx="1.5" ry="1" fill="#12101a"/>
    <ellipse cx="4" cy="-15" rx="1.5" ry="1" fill="#12101a"/>
    <!-- Eyes -->
    <circle cx="-9" cy="-6" r="3.5" fill="#1a1220"/>
    <circle cx="-9" cy="-6" r="1.8" fill="#6a5040" opacity="0.7"/>
    <circle cx="9" cy="-6" r="3.5" fill="#1a1220"/>
    <circle cx="9" cy="-6" r="1.8" fill="#6a5040" opacity="0.7"/>
    <!-- Horns -->
    <path d="M-14,-20 L-24,-44 L-12,-24" fill="#241c30"/>
    <path d="M14,-20 L24,-44 L12,-24" fill="#241c30"/>
    <path d="M-7,-24 L-12,-40 L-5,-26" fill="#241c30"/>
    <path d="M7,-24 L12,-40 L5,-26" fill="#241c30"/>
    <!-- Jaw -->
    <path d="M-12,2 C-8,8 8,8 12,2" fill="none" stroke="#3a3040" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- Wings -->
  <g opacity="0.55">
    <!-- Left wing -->
    <path d="M145,95 C118,62 76,50 56,66 C42,80 48,104 68,112 C84,118 112,110 138,98"
      fill="#1a1226" opacity="0.6"/>
    <path d="M140,92 L78,54" stroke="#241c30" stroke-width="0.6" opacity="0.4"/>
    <path d="M134,96 L66,64" stroke="#241c30" stroke-width="0.6" opacity="0.4"/>
    <path d="M128,100 L58,74" stroke="#241c30" stroke-width="0.6" opacity="0.4"/>
    <path d="M120,106 L52,88" stroke="#241c30" stroke-width="0.6" opacity="0.4"/>
    <!-- Right wing -->
    <path d="M255,95 C282,62 324,50 344,66 C358,80 352,104 332,112 C316,118 288,110 262,98"
      fill="#1a1226" opacity="0.6"/>
    <path d="M260,92 L322,54" stroke="#241c30" stroke-width="0.6" opacity="0.4"/>
    <path d="M266,96 L334,64" stroke="#241c30" stroke-width="0.6" opacity="0.4"/>
    <path d="M272,100 L342,74" stroke="#241c30" stroke-width="0.6" opacity="0.4"/>
    <path d="M280,106 L348,88" stroke="#241c30" stroke-width="0.6" opacity="0.4"/>
  </g>
</svg>